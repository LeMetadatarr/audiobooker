    body:
      string: "<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\">\n<html>\n<head>\n
        \ <title>Audio Anarchy</title>\n                           \n  <meta http-equiv=\"content-type\"
        content=\"text/html; charset=ISO-8859-1\">\n  <link rel=StyleSheet href=\"main.css\">\n</head>\n\n<body>\n\n<div
        id=\"frame\">\n  <div id=\"contenttop\"><img src=\"ahead6.gif\"></div>\n  <div
        id=\"navbar\">\n  <span class=\"navlink\">Audio Books</span>\n  <span class=\"navspacer\"></span>\n
        \ <span class=\"navlink\"><a href=\"/radio/\">Original Recordings</a></span>\n
        \ <span class=\"navspacer\"></span>\n  <span class=\"navlink\"><a href=\"/store/\">Store</a></span>\n
        \ </div>\n\n<div id=\"contentleft\">\n\n    <div id=\"description\">\n      <i>Audio
        Anarchy</i> is a project for transcribing anarchist books into audio format.\n
        \     <p>\n      Hopefully, this can help make anarchist texts and ideas more
        accessable.  Beyond the\n      obvious appeal for people who don't like to
        read (or don't have <i>time</i> to read in this busy\n      on-the-go world),
        hearing a book read aloud can also be enjoyable.\n      <p>\n      The <i>Audio
        Anarchy</i> project is organized in a distributed way.  Instead of having\n
        \     a single person or group of people read an entire book, different people
        read separate\n      chapters to distribute the work load.  Ideally, this
        site will do more to help facilitate\n      that kind of organization in the
        future.\n      <p>\n</div>\n\n<p>\n  </div>\n  <div id=\"contentcenter\">\n\n
        \   <div id=\"album\">\n    <div id=\"graphic\"><img src=\"letters.gif\" alt=\"Letters
        Of Insurgents\"></div>\n\tFreddy Perlman's <i>Letters Of Insurgents</i> is
        a thoroughly brilliant\n\tstory about anarchist ideas.  It takes the form
        of fictional letters between\n\ttwo eastern european workers who were separated
        after a failed\n\trevolution;  one spent twelve years in statist jails, the
        other \n\tescaped to the west.  After twenty-five years without contact, they\n\tbegin
        to write each-other about their experiences, their lives, their\n\thopes,
        and their memories of the past.  The characters that emerge from\n\tthese
        narratives tell a story that is both incredibly subtle and\n\tinfinitely complex.
        \ Nothing is taken for granted, no assumptions are\n\tleft unchallenged, and
        the reader is left with a set of questions that\n\tonly a story about relationships
        could present.\n\t<p>\n\tBeing a particularly long book, each letter will
        be presented here\n\ta week at a time until the entire recording is finished.
        \ And everyone \n\twho\n\tlistens to the entire book will receive a Letters
        Of Insurgents Merit\n\tBadge.\n    <div id=\"subalbum\">\n    <a href=\"letters.html\">Download
        MP3s</a>\n    </a>\n    </div>\n  </div>\n<p>\n\n    <div id=\"album\">\n
        \   <div id=\"graphic\"><img src=\"spectacle.gif\" alt=\"Thoughts On Society
        Of The Spectacle\"></div>\n    \"The whole life of those societies in which
        modern conditions of production\n    prevail presents itself as an immense
        accumulation of <i>spectacles</i>.\n    All that once was directly lived has
        become mere representation.\"\n    <p>\n    Instead of a direct recording
        of the text, here a collection of people read\n    some of their favorite
        aphorisms, and tell stories about how those aphorisms\n    relate to their
        lives.\n    <div id=\"subalbum\">\n    <a href=\"spectacle.html\">Download
        MP3s</a>\n    </a>\n    </div>\n  </div>\n<p>\n\n    <div id=\"album\">\n
        \   <div id=\"graphic\"><img src=\"submission.jpg\" alt=\"Against The Logic
        Of Submission\"></div>\n    \"Submission to domination is enforced not solely,
        nor even most significantly, through blatant repression, but rather through
        subtle manipulations worked into the fabric of everyday social relationships.
        These manipulations &mdash; ingrained in the social fabric not because domination
        is everywhere and nowhere, but because the institutions of domination create
        rules, laws, mores and customs that enforce such manipulations &mdash; create
        a logic of submission, an often unconscious tendency to justify resignation
        and subservience in one's everyday relations in the world. For this reason,
        it is necessary for those who are serious about developing an anarchist insurrectional
        project to confront this tendency wherever it appears &mdash; in their lives,
        their relationships and the ideas and practices of the struggles in which
        they participate. Such a confrontation is not a matter of therapy, which itself
        partakes of the logic of submission, but of defiant refusal.\"\n    <div id=\"subalbum\">\n
        \   <a href=\"submission.html\">Download MP3s</a>\n    </a>\n    </div>\n
        \ </div>\n<p>\n\n    <div id=\"album\">\n    <div id=\"graphic\"><img src=\"tension.jpg\"
        alt=\"The Anarchist Tension\"></div>\n\"Anarchism is not a concept that can
        be locked up in a word like a gravestone.  It is not a political theory.  It
        is a way of conceiving life.  And life, young or old as we may be, is not
        something definitive: it is a stake we must play day after day.  When we wake
        up in the morning and put our feet on the ground we must have a good reason
        for getting up.  If we don't it makes no difference whether we are anarchists
        or not.  We might as well stay in bed and sleep.\"<p>\nAlfredo M. Bonanno,
        an Italian anarchist currently serving six years for charges related to the
        famous \"Marini Trial,\" writes about insurrectionary anarchism. \n    <div
        id=\"subalbum\">\n    <a href=\"tension.html\">Download MP3s</a>\n    </a>\n
        \   </div>\n  </div>\n<p>\n\n\n    <div id=\"album\">\n    <div id=\"graphic\"><img
        src=\"antiwork.jpg\" alt=\"Anti-Work Essays\"></div>\n\"Why do we work? From
        necessity or love? If the former, then our world is failing us, we are being
        exploited, being made slaves for the benefit of others. The ethic that work
        is a 'good thing' is a throwback to a Victorian mentality of puritanical pain
        and denial of our humanity, an ethic that is so far removed from the reality
        of our human nature as to be pathological.\"<p>\n    A collection of essays
        written from the anti-work perspective.  These essays investigate concepts
        of freedom, compulsory labor, the 'work ethic', the wages system, employment,
        and 'occupations.'\n    <div id=\"subalbum\">\n    <a href=\"antiwork.html\">Download
        MP3s</a>    \n    </a>\n    </div>\n  </div>\n<p>\n\n    <div id=\"album\">\n
        \   <div id=\"graphic\"><img src=\"daysofwarnightsoflove.jpg\" alt=\"Days
        Of War, Nights Of Love\"></div>\n    \"Less of a novel and more of an exploded
        manifesto, <i>Days of War, Nights of Love</i> might be just what we need.
        It is the type of book you'd thumb through in the store and actually want
        to buy (or steal)... Topics range from anarchy to hierarchy, work to sex,
        alienation to liberation and technology, but every page burns with a passion
        for a freer life... When you make it to the end, the personal testimonials
        about not working and the closing art pieces become an aria of voices urging
        you to close the book and live. Glorious, even for the most cynical reader.
        What more can we ask from a book?\" - <i>Clamor Magazine #6, Dec.00/Jan.01</i>\n
        \   <div id=\"subalbum\">\n    <a href=\"downol.html\">Download MP3s</a>    \n
        \   </a>\n    </div>\n  </div>\n<p>\n    <div id=\"album\">\n    <div id=\"graphic\"><img
        src=\"emma.jpg\" alt=\"Emma Goldman Essays\"></div>\n    \"In the eighteen-nineties
        and for years thereafter, America reverberated with the name of the 'notorious
        Anarchist,' feminist, revolutionist and agitator, Emma Goldman.  A Russian
        Jewish immigrant at the age of 17, she moved by her own efforts from seamstress
        in a clothing factory to internationally known radical lecturer, writer, editor
        and friend of the oppressed.  ...a collection of her remarkably penetrating
        essays, far in advance of their time, originally published by the <i>Mother
        Earth</i> press which she founded.\"\n    <div id=\"subalbum\">\n    <a href=\"emma.html\">Download
        MP3s</a>    \n    <a href=\"/store/\">Order 2 CD Set</a>\n    </a>\n    </div>\n
        \ </div>\n<p>\n    <a href=\"rss.xml\"><img src=\"xml.gif\" border=\"0\"></a>\n<p><br>\n
        \ </body>\n</html>\n"
