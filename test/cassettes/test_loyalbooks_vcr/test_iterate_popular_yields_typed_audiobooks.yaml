        xmlns:atom=\"http://www.w3.org/2005/Atom\">\n<channel>\n\n<title><![CDATA[The
        Sinking of the Titanic and Great Sea Disasters by Logan Marshall]]></title>\n<link>http://www.loyalbooks.com/book/the-sinking-of-the-titanic-and-great-sea-disasters-by-marshall-logan</link>\n<language>en-us</language>\n<copyright>&#169;
        2026 LoyalBooks.com</copyright>\n<itunes:author>Loyal Books</itunes:author>\n\n<itunes:subtitle><![CDATA[Logan
        Marshall's book \"The Sinking of the Titanic and Great Sea Disasters\" gives
        readers a first-hand account of the greatest sea disaster of all time straight
        from the survivors of the ill-fated sunken ship...]]></itunes:subtitle>\n\n<itunes:summary><![CDATA[Logan
        Marshall's book \"The Sinking of the Titanic and Great Sea Disasters\" gives
        readers a first-hand account of the greatest sea disaster of all time straight
        from the survivors of the ill-fated sunken ship. Unlike many of the books
        about the Titanic that was written recently, Logan Marshall was fortunate
        that he was able to interview the survivors of the Titanic and access to all
        the important documents about the ship, including the diagrams, maps and actual
        photographs related to the disaster. With this, he was able to write the best
        book that has a complete and accurate account of the Titanic and its tragic
        fate. \r\nThe Titanic as most people know was the biggest ocean liner during
        her time and was hailed as \u201Cunsinkable\u201D by the company which made
        it. Officially known as the RMS Titanic, this mammoth ship can carry more
        than 2,000 passengers and owned by British shipping company White Star Line.
        The ship has a double-bottomed hull and watertight compartments which make
        her \u201Cunsinkable\u201D according to her owners. But as we all know, this
        claim was proven to be wrong when she sank in the North Atlantic during her
        maiden voyage. \r\nLogan Marshall did well to make use of all the resources
        that were at his disposal. Not only was he able to make detailed descriptions
        of the disaster, he was also able to narrate them well from a human point
        of view without compromising any truth about the biggest sea tragedy of all
        time. This book is a must read for anybody who's deeply interested in the
        Titanic and its unfortunate end. \r\nThe movie \u201CTitanic\u201D is now
        considered as a timeless classic and so is this book. If you're a fan of the
        movie which features Leonardo Di Caprio and Kate Winslet, you'll also like
        reading this book.\r\n]]></itunes:summary>\n\n<description><![CDATA[Logan
