        of the Rights of Woman","description":"Wollstonecraft (1759-1797) is best
        known for A Vindication of the Rights of Woman, in which she argued that women
        are not naturally inferior to men, but only appeared to be because they lacked
        education. She suggested that both men and women should be treated as rational
        beings and imagined a social order founded on reason. - Today, Wollstonecraft
        is considered a foundational thinker in feminist philosophy. Her early advocacy
        of women''s equality and her attacks on conventional femininity and the degradation
        of women presaged the later emergence of the feminist political movement.
        Feminist scholars and activists have cited both her philosophical ideas and
