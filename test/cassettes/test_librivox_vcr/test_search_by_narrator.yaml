        to un-certain English words, their origin, meaning, legitimate and illegitimate
        use...\" <br \/><br \/>This a a short but amusing dictionary which \"redefines\"
        words in some interesting ways. Funny and sometimes bizarre observations are
        sprinkled throughout. In keeping with LibriVox policy to read, rather than
        attempt to rewrite, books - even those with offensive content - nothing has
        been omitted. While many of the definitions may just seem confusing or \"corny\"
        to modern readers, there are a couple that also might be considered \"objectionable,\"
