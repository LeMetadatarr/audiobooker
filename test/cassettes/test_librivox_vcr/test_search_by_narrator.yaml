        of Huckleberry Finn","description":"<em>Adventures of Huckleberry Finn<\/em>
        (1884) by Mark Twain is one of the truly great American novels, beloved by
        children, adults, and literary critics alike.  The book tells the story of
        \u201cHuck\u201d Finn (first introduced as Tom Sawyer\u2019s sidekick in <em>The
        Adventures of Tom Sawyer<\/em>), his friend Jim, and their journey down the
        Mississippi River on a raft.  Both are on the run, Huck from his drunk and
        abusive father, and Jim as a runaway slave.<br><br>As Huck and Jim drift down
        the river, they meet many colorful characters and have many great adventures.  The
        true heart of the story, however, is the friendship between Huck and Jim.  A
        constant theme throughout the book is Huck\u2019s internal struggle between
        what he has been taught, that helping a runaway slave is a sin, and what he
        truly believes, that Jim is a good man and it couldn\u2019t possibly be wrong
        to help him.<br><br><em>Adventures of Huckleberry Finn<\/em> was unique at
        the time of its publication (1884) because it is narrated by Huck himself
        and is written in the numerous dialects common in the area and time in which
        the book is set.  Although the book was originally intended as a sequel to
        the children\u2019s book <em>The Adventures of Tom Sawyer<\/em>, as Twain
        wrote <em>Adventures of Huckleberry Finn<\/em> it progressed into a more serious
        work.  Twain\u2019s views on slavery and other social issues of the time become
        clear through the words, thoughts, and actions of Huck Finn.  The book has
        always been the subject of great controversy, and according to <a href=\"https:\/\/www.ala.org\/bbooks\/frequentlychallengedbooks\/decade1999\"
        target=\"_blank\">The American Library Association<\/a> it was fifth on the
        list of most frequently challenged books in the 1990s.<br>(Summary by Annie
