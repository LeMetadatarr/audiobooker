        Sayers (d. 2015)"}]}],"genres":[{"id":"19","name":"Humorous Fiction"}],"translators":[]},{"id":"79","title":"Ranald
        Bannerman''s Boyhood","description":"George MacDonald is mainly known for
        his fantasy works and fairy tales such as At the Back of the North Wind and
        the Princess and the Goblin. However, during his life he was more famous for
        many more realistic novels. . . among them the somewhat autobiographical Ranald
        Bannerman''s Boyhood.\n<p>This story of a young motherless boy growing up
        with his brothers in a Scottish manse is full of delightful characters. There
        is Kirsty, an enchanting Highland storyteller, Turkey, the intrepid cowherd,
        the evil Kelpie, and the lovely Elsie Duff. Throughout the twists and turns
        of his escapades and adventures Ranald learns from his father the important
