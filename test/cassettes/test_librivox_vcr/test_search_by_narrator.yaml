        \u00c2ge, nous ferons encore r\u00eaver ou frissonner avec leurs jeunes filles
        et jeunes gens dans l''adversit\u00e9, leurs princesses et leurs princes et,
        bien s\u00fbr, leurs f\u00e9es.\nRetrouvons donc le petit Chaperon rouge,
        Cendrillon, le Chat bott\u00e9, ... et red\u00e9couvrons d''o\u00f9 nous vient
