        & Adventure"}],"translators":[]},{"id":"94","title":"Wind in the Willows","description":"This
        much-loved story follows a group of animal friends in the English countryside
        as they pursue adventure \u2026 and as adventure pursues them! The chief characters
        - Mole, Rat, and Toad - generally lead upbeat and happy lives, but their tales
        are leavened with moments of terror, homesickness, awe, madcap antics, and
        derring-do.<br \/><br \/>\nAlthough classed as children\u2019s literature,
        The Wind in the Willows holds a gentle fascination for adults too. The vocabulary
        is decidedly not \u201cDick and Jane\u201d, and a reader with a love of words
        will find new ones to treasure, even if well-equipped for the journey. Parents
        will appreciate the themes of loyalty, manners, self-restraint, and comradeship
        which are evident throughout the book. When the characters err, they are prompt
        to acknowledge it, and so a reading of this book can model good behavior to
        children, who will otherwise be enchanted with the many ways in which the
        lives of these bucolic characters differ from modern life.<br \/><br \/>\nThis
        book was so successful that it enabled the author to retire from banking and
        take up a country life somewhat like that of his creations. It has been adapted
        for screen, stage, and even a ride at the original Disneyland.<br \/>\n(Summary
        by Mark F. Smith)","url_text_source":"https:\/\/www.gutenberg.org\/etext\/289","language":"English","copyright_year":"1908","num_sections":"12","url_rss":"https:\/\/librivox.org\/rss\/94","url_zip_file":"https:\/\/archive.org\/compress\/wind_in_the_willows_collab_librivox\/formats=64KBPS
