        Legends & Fairy Tales"}],"translators":[]},{"id":"75","title":"Uncle Tom''s
        Cabin","description":"Among the most \u201cbanned\u201d books in the United
        States, Uncle Tom\u2019s Cabin; or, Life Among the Lowly is a novel by American
        author Harriet Beecher Stowe which treats slavery as a central theme. Stowe
        was a Connecticut-born teacher at the Hartford Female Academy and an active
        abolitionist. The novel is believed to have had a profound effect on the North\u2019s
        view of slavery. In fact, when he met Harriet Beecher Stowe, President Lincoln
        is said to have commented, \u201cSo you\u2019re the little lady whose book
        started the Civil War.\u201d First published on March 20, 1852, the story
        focuses on the tale of Uncle Tom, a long-suffering black slave, the central
        character around whose life the other characters\u2014both fellow slaves and
        slave owners\u2014revolve. The novel depicts the harsh reality of slavery
        while also showing that Christian love and faith can overcome even something
        as evil as enslavement of fellow human beings. (summary by Wikipedia and John
        Greenman)<br \/><br \/>\n<b>Note From the Reader: <\/b>\nThe listener is about
