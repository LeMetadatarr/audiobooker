        Caudle''s Curtain Lectures","description":"Douglas William Jerrold (1803-1857)
        was the son of an actor manager. After some time in the Navy and as an apprentice
        printer he became a playwright and later a journalist. He was a contemporary
        and friend of Charles Dickens. As a journalist he worked for Punch magazine
        in which Mrs Caudle''s Curtain Lectures were serialised, to be published in
        book form in 1846.<br \/><br \/>Job Caudle, the ''hero'' of the book is a
        Victorian shopkeeper whose wife finds she can only talk to him without interruption
        in bed. Caudle, who outlives his wife, finds he can no longer sleep easily
        because of his memory of these ''lectures'' and resolves to exorcise his wife''s
        memory by recording the lectures, it seems with a view to future publication
        for the edification of others. Jerrold''s humour shines through this insight
        into Victorian middle class culture. (Summary by Martin Clifton)","url_text_source":"https:\/\/www.gutenberg.org\/etext\/6054","language":"English","copyright_year":"1846","num_sections":"38","url_rss":"https:\/\/librivox.org\/rss\/88","url_zip_file":"https:\/\/archive.org\/compress\/mrs_caudles_curtain_lectures_librivox\/formats=64KBPS
