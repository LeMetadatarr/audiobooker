        Fiction"}],"translators":[]},{"id":"67","title":"Divine Comedy","description":"The
        Divine Comedy (Italian: Commedia, later christened \"Divina\" by Giovanni
        Boccaccio), written by Dante Alighieri between 1308 and his death in 1321,
        is widely considered the central epic poem of Italian literature, the last
        great work of literature of the Middle Ages and the first great work of the
        Renaissance. A culmination of the medieval world-view of the afterlife, it
        establishes the Tuscan dialect in which it is written as the Italian standard,
        and is seen as one of the greatest works of world literature. - The Divine
        Comedy is composed of three canticas (or \"cantiche\") \u2014 Inferno (Hell),
        Purgatorio (Purgatory), and Paradiso (Paradise) \u2014 composed each of 33
        cantos (or \"canti\"). The very first canto serves as an introduction to the
        poem and is generally not considered to be part of the first cantica, bringing
        the total number of cantos to 100. - The poet tells in the first person his
        travel through the three realms of the dead, lasting during the Easter Triduum
