        des Mousquetaires du Roi (Memoirs of Mister D''Artagnan, Lieutenant Captain
        of the first company of the King''s Musketeers) by Gatien de Courtilz de Sandras
        (Cologne, 1700). <br><br>\nDumas'' version of the story covers the adventures
