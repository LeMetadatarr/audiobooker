        covers events in the year 1812.","url_text_source":"https:\/\/www.gutenberg.org\/etext\/2600","language":"English","copyright_year":"1922","num_sections":"19","url_rss":"https:\/\/librivox.org\/rss\/3668","url_zip_file":"https:\/\/archive.org\/compress\/war_and_peace_14_1003_librivox\/formats=64KBPS
