        xmlns:atom=\"http://www.w3.org/2005/Atom\" version=\"2.0\">\n<channel>\n  <title><![CDATA[Childhood
        by Leo Tolstoy (1828 - 1910)]]></title>\n  <link><![CDATA[https://librivox.org/childhood-english-trans-by-leo-tolstoy-translated-by-c-j-hogarth/]]></link>\n
        \ <atom:link rel=\"self\" href=\"https://librivox.org/rss/162\" />\n  <description><![CDATA[Childhood,
        published in 1852, is the first novel in Leo Tolstoy\u2019s autobiographical
        trilogy, which also includes Boyhood, and Youth. Published when Tolstoy was
        twenty-three, the book gained immediate notice among Russian writers including
        Ivan Turgenev, and heralded the young Tolstoy as a major figure in Russian
        letters. Childhood is an expressionist exploration of the internal life of
        a young boy, Nikolenka, and was a new form in Russian writing, mixing fact,
        fiction and emotions to render the moods and reactions of the narrator. Childhood
        is Tolstoy\u2019s first published work. Translated into English by C. J. Hogarth.
        (Summary by Hugh)]]></description>\n  <!--<genre>project element=Genre</genre>-->\n
        \ <language><![CDATA[en]]></language>\n  <itunes:type>serial</itunes:type>\n
        \ <itunes:author>LibriVox</itunes:author>\n  <itunes:summary><![CDATA[Childhood,
        published in 1852, is the first novel in Leo Tolstoy\u2019s autobiographical
        trilogy, which also includes Boyhood, and Youth. Published when Tolstoy was
        twenty-three, the book gained immediate notice among Russian writers including
        Ivan Turgenev, and heralded the young Tolstoy as a major figure in Russian
        letters. Childhood is an expressionist exploration of the internal life of
        a young boy, Nikolenka, and was a new form in Russian writing, mixing fact,
        fiction and emotions to render the moods and reactions of the narrator. Childhood
        is Tolstoy\u2019s first published work. Translated into English by C. J. Hogarth.
        (Summary by Hugh)]]></itunes:summary>\n  <itunes:owner>\n    <itunes:name>LibriVox</itunes:name>\n
