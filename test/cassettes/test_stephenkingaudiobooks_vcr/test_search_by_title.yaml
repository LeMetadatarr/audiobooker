        class=\"collapseomatic \" id=\"id69fcb4a195407\"  tabindex=\"0\" title=\"text\"
        \   >text</span><div id=\"target-id69fcb4a195407\" class=\"collapseomatic_content
        \">\n<p>Stephen King&#8217;s novel Carrie, his first published book, appearing
        in 1975, propelled him into the general consciousness. It tells the story
        of an abused woman who discovers her latent power of telekinesis and utilizes
        it to punish and destroy a town.</p>\n<p>The novel begins with Carrie, a 16-year-old
        dwelling in Chamberlain, Maine, undergoing her first period in the shower
        of the college&#8217;s locker room. Her mom, a fanatical Christian that abuses
        Carrie, has never told her about childbirth because she considers it to be
        a indication of sin. Carrie thinks she&#8217;s bleeding to death, as the girls
        in the shower pelt her with tampons and sanitary napkins.\_Stephen King &#8211;
        Carrie Audiobook.</p>\n<p>The gym instructor, Miss Desjardin, finds her and
        can be frustrated in the beginning with Carrie&#8217;s refusal to take care
        of the situation. She immediately realizes that Carrie has no clue what&#8217;s
        going on, and Miss Desjardin reigns from the women because a light bulb shatters
        over her mind. Once she will help Carrie clean up and attempts to explain
        to her what&#8217;s happening.</p>\n<p>When Carrie gets home, her mother finds
        out what happened, and locks Carrie from the prayer closet. She believes Carrie&#8217;s
        period is the result of some unknown sin and is her fault. At college, Miss
        Desjardin attempts to receive all the bullies suspended and revokes their
        best to go to prom. Mr. Hargensen, the school&#8217;s attorney and the father
        of the lead writer, Chris, overrules her. Henry Gayle acquiesces and gives
        the women a boot camp style detention with Miss Desjardin so that they can
        make the right to go to prom.\_Stephen King &#8211; Carrie Audiobook Free.</p>\n<p>When
        Chris won&#8217;t attend the detention, she&#8217;s suspended and prohibited
        from prom. This time, her dad can&#8217;t come to her help. Carrie gradually
        uncovers her abilities, discovering that she&#8217;s had them since birth,
        and following the beginning of her period, they have reappeared.</p>\n<p>Another
        popular woman, Sue Snell, feels bad about teasing Carrie and decides to make
        it up for her. She awakens her boyfriend, Tommy, to ask Carrie to the prom.
        Carrie is suspicious however comes and says yes. She makes a red velvet dress,
        but her mother is horrified that she&#8217;d do something so sinful as going
        to a dance. She believes sex is sinful even after marriage, and she shows
        that she&#8217;s understood about Carrie&#8217;s powers all along.</p>\n<p>At
        first, the prom is good for Carrie, but Chris and Billy rig the prom election
        that Carrie and Tommy are chosen King and Queen. When they arrive at the front
        to accept their crowns, two buckets of pig&#8217;s blood fall on their heads.
        Carrie by\_Stephen King Audiobook.</p>\n<p>Carrie runs from the building as
        everybody laughs at her. When she gets outside, she remembers her abilities.
        Initially, she only plans to lock the doors and turn on the sprinklers, but
        they respond with the electric speakers and electrocute two individuals. She
        subsequently causes a massive fire which kills almost everyone inside.</p>\n<p>As
        she walks home, she causes massive fires by breaking power lines and causing
        gas channels to explode. She has home, and her mother attempts to kill her
        to stop what she thinks is the devil&#8217;s work. She reveals that Carrie&#8217;s
        conception was the result of marital rape; Carrie kills her mother by stopping
        her heart when her mother stabs her with a kitchen knife.</p>\n<p>She goes
        to ruin the roadhouse in which she had been conceived, but she sees Chris
        and Billy. They attempt to run, but she wrecks the car and causes a passion
        which kills them. The whole time, she provides off &#8220;broadcast telepathy&#8221;
