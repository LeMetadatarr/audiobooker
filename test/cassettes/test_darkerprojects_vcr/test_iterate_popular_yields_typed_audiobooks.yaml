        \           <h1 class=\"entry-title\">Fan Fiction Shows</h1>        </header><!--
        .entry-header -->\n        <div class=\"entry-content-wrap\">\n        \n
        \       <div class=\"entry-content\">\n            <div class=\"inner-entry-content\">\n
        \               \r\n<p>All of our Fan-Fiction shows are properties of their
        network or writers. No infringement of those rights is intended, and no monies
        will be collected for any production.\_ All stories used here are the property
        of their authors and are used with permission.</p>\r\n<p>&nbsp;</p>\r\n<p>\r\n\r\n</p>\r\n<figure
        class=\"wp-block-table is-style-regular\">\r\n<table>\r\n<tbody>\r\n<tr>\r\n<td><img
        decoding=\"async\" style=\"width: 900px;\" src=\"http://darkerprojects.com/wp-content/uploads/2020/10/Batman-No_Mans_Land-Logo.png\"
        /></td>\r\n<td class=\"has-text-align-center\" data-align=\"center\"><br /><span
        class=\"has-inline-color has-white-color\"><a href=\"http://darkerprojects.com/batman-no-mans-land\"><strong><em>Batman:
        No Man\u2019s Land</em></strong></a>\_ </span><br />Based primarily on the
        Novelization of the \u201CNo Man\u2019s Land\u201D Comic Book Arc.\_<span
        style=\"color: #ff0000;\"><strong><span class=\"has-inline-color has-vivid-red-color\">(Discontinued)</span></strong></span></td>\r\n</tr>\r\n<tr>\r\n<td><img
        decoding=\"async\" style=\"width: 200px;\" src=\"http://darkerprojects.com/wp-content/uploads/2018/03/DarkMatter_spores.jpg\"
        /></td>\r\n<td class=\"has-text-align-center\" data-align=\"center\"><br /><strong><em><a
        href=\"http://darkerprojects.com/dark-matter/\"><span class=\"has-inline-color
        has-white-color\">Dark Matter\_</span></a></em></strong><br />\_Meet Sam Packer
        \u2013 a police officer in Colorado. \_His world is about to be turned upside
        down as he turns into a werewolf.\_<span style=\"color: #ff0000;\"><strong><span
        class=\"has-inline-color has-vivid-red-color\">(Discontinued)</span></strong></span></td>\r\n</tr>\r\n<tr>\r\n<td><img
        decoding=\"async\" style=\"width: 200px;\" src=\"http://darkerprojects.com/wp-content/uploads/2018/03/DoctorWho.jpg\"
        /></td>\r\n<td class=\"has-text-align-center\" data-align=\"center\"><br /><strong><em><a
        href=\"http://darkerprojects.com/doctor-who/\"><span class=\"has-inline-color
        has-white-color\">Doctor Who</span></a></em></strong><br />\_Darker Projects
        offers you a new Doctor, new situations, and a new darker streak, in a universe
        that is no longer black and white. The decisions are tougher, and who can
        really walk the difficult line to keep order?</td>\r\n</tr>\r\n<tr>\r\n<td><img
        decoding=\"async\" style=\"width: 200px;\" src=\"http://darkerprojects.com/wp-content/uploads/2020/10/He-Man.jpg\"
        /></td>\r\n<td class=\"has-text-align-center\" data-align=\"center\"><br /><span
        class=\"has-inline-color has-white-color\"><a href=\"http://darkerprojects.com/he-man-the-parody\"><strong><em>He-Man:
        The Parody</em></strong></a>\_</span><br />Darker Projects jab at laughter
        and having a bit of fun.\_\_<span style=\"color: #ff0000;\"><strong><span
        class=\"has-inline-color has-pale-pink-color\">(Completed)</span></strong></span></td>\r\n</tr>\r\n<tr>\r\n<td><img
        decoding=\"async\" style=\"width: 200px;\" src=\"http://darkerprojects.com/wp-content/uploads/2020/10/Outer_Limits.jpg\"
        /></td>\r\n<td class=\"has-text-align-center\" data-align=\"center\"><br /><span
        class=\"has-inline-color has-white-color\"><a href=\"http://darkerprojects.com/outer-limits\"><strong><em>Outer
        Limits</em></strong></a>\_</span><br />An audio theater series tribute to
        Outer Limits</td>\r\n</tr>\r\n<tr>\r\n<td><img decoding=\"async\" style=\"width:
        200px;\" src=\"http://darkerprojects.com/wp-content/uploads/2020/10/QL-DP-PIC.jpg\"
        /></td>\r\n<td class=\"has-text-align-center\" data-align=\"center\"><br /><span
        class=\"has-inline-color has-white-color\"><a href=\"http://darkerprojects.com/quantum-leap\"><strong><em>Quantum
        Leap</em></strong></a>\_</span><br />Our interpretation of the Universal TV
        Show Quantum Leap &#8211; as Sam Beckett leaps from life to life putting things
        right that once went wrong and hoping each time that his next leap will be
        the leap home.</td>\r\n</tr>\r\n<tr>\r\n<td><img decoding=\"async\" style=\"width:
        200px;\" src=\"http://darkerprojects.com/wp-content/uploads/2018/03/QuantumRetribution.jpg\"
        /></td>\r\n<td class=\"has-text-align-center\" data-align=\"center\"><br /><a
        href=\"http://darkerprojects.com/quantum-retribution\"><em><span class=\"has-inline-color
        has-white-color\"><strong>Quantum Retribution</strong>\_</span></em></a><br
        />The darker side of the Quantum Leap coin &#8211; Nathaniel Lothoman uses
        his own devices to send people into the past to destroy lives and keep the
        people in his complex under his control.\_</td>\r\n</tr>\r\n<tr>\r\n<td><img
        decoding=\"async\" style=\"width: 200px;\" src=\"http://darkerprojects.com/wp-content/uploads/2015/05/LostFrontier-Logo.jpg\"
        /></td>\r\n<td class=\"has-text-align-center\" data-align=\"center\"><br /><strong><em><a
        href=\"http://darkerprojects.com/lostfrontier/\"><span class=\"has-inline-color
        has-white-color\">Star Trek: Lost Frontier</span></a>\_</em></strong><br />It
        is the dawn of the 25th century and the galaxy is coming out of a period of
        a great war. The story of Lost Frontier focuses on the crew of the new Enterprise
        F as they go forth to unite the lost worlds of the Federation.</td>\r\n</tr>\r\n<tr>\r\n<td><img
        decoding=\"async\" style=\"width: 200px;\" src=\"http://darkerprojects.com/wp-content/uploads/2020/10/startrek-s31.jpg\"
        /></td>\r\n<td class=\"has-text-align-center\" data-align=\"center\"><br /><em><span
        class=\"has-inline-color has-white-color\"><a href=\"http://darkerprojects.com/section31/\"><strong>Star
        Trek:\_Section 31</strong></a>\_</span></em><br />The universe of shiny, well-groomed
        Starfleet officers and the pristine starships of the United Federation of
        Planets where the Prime Directive rules and hopes for the galactic unity of
        all species is an ongoing quest is reinterpreted in our vision of the reality
        of the Star Trek Universe. It\u2019s not all \u201Clet\u2019s be friends with
        our alien brethren\u201D. Here the Federation has a dark underbelly and the
        daring crew of the Nosferatu boldly goes where Starfleet fears to tread.\_<span
        style=\"color: #ff0000;\"><strong><span class=\"has-inline-color has-vivid-red-color\">(Discontinued)</span></strong></span></td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</figure>\r\n<p>\r\n\r\n</p>\r\n<p>&nbsp;</p>\r\n<p></p>
