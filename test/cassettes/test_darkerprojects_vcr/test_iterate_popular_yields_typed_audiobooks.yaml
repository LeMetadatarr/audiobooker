        \                       \n<article id=\"post-154\" class=\"post-154 page type-page
        status-publish hentry\">\n    \n        <header class=\"entry-header\">\n
        \           <h1 class=\"entry-title\">Auditions!</h1>        </header><!--
        .entry-header -->\n        <div class=\"entry-content-wrap\">\n        \n
        \       <div class=\"entry-content\">\n            <div class=\"inner-entry-content\">\n
        \               \r\n<div class=\"wp-block-group\">\r\n<div class=\"wp-block-group__inner-container\">\r\n<p>We
        are thoroughly excited that you want to audition for one of our productions!</p>\r\n<p>Thank
        you for auditioning and making our site grow!\_ See below for Current Casting
        Calls and Results of Casting Calls below it.\_</p>\r\n<p>&nbsp;</p>\r\n</div>\r\n</div>\r\n<hr
        />\r\n<h1 class=\"wp-block-heading\">Current Casting Calls:</h1>\r\n<p>There
        is a current casting call for Quantum Leap:\_ I&#8217;m Getting Married in
        Absentia.</p>\r\n<p>Unpaid &#8211; Done for the love of audio.\_\_</p>\r\n<p>Auditions
        will be held until 8/31/2025 at midnight.\_ There are male and female parts
        that are needed.\_\_</p>\r\n<p>Here is a copy of the PDF so you can print
        it out if you are trying out for multiple roles:\_ <a href=\"https://darkerprojects.dreamhosters.com/audio/quantumleap/auditions/Casting%20Call%20for%20Quantum%20Leap.pdf\">Audition
        PDF</a></p>\r\n<p><strong>AUDITION GUIDELINES:</strong></p>\r\n<ul>\r\n<li>Record
        your lines in 44100 MP3 format and in <u>one complete file</u>.</li>\r\n<li>At
        the beginning, state your name plainly and give at least a 5-second recording
        of your room tone.</li>\r\n<li>DO NOT clean your lines before you send them
        in. Please leave them raw.</li>\r\n<li>Give us your three best takes on the
        lines.</li>\r\n<li>If you are required to yell in the audio, please take one
        step back from your microphone to do the line.</li>\r\n<li>Label your MP3
        file: mp3\_ An example would be:\_ Sam_PaulArbisi_Absentia.mp3</li>\r\n<li>Send
        your MP3 file to <a href=\"mailto:mj@darkerprojects.com\">mj@darkerprojects.com</a></li>\r\n<li>Please
        put Quantum Leap EP 6 Auditions in the Subject line of your email.</li>\r\n</ul>\r\n<p><strong>Marty
        Ahrlett \u2013 pronounced Ar-let</strong></p>\r\n<p><strong>Description:</strong>
        Navy crew member with a straightforward work ethic and mild humor.<br /><strong>Audition
        Lines:</strong></p>\r\n<ol>\r\n<li>\u201CThat ought to do it. Nice and clean!\u201D</li>\r\n<li>\u201CI
        sure wasn\u2019t in the mood to hose this thing down. I wonder if they\u2019ll
        ever find the short that causes that light to come on?\u201D</li>\r\n<li>\u201CDo
        what? Did you see something?\u201D</li>\r\n<li>\u201CYou tell me, Stubbs!
        Are you awake?\u201D<br /><strong>Performance Notes:</strong> Keep it conversational;
        hint of good-natured sarcasm.</li>\r\n</ol>\r\n<p><strong>Mike O\u2019Connell</strong></p>\r\n<p><strong>Description:</strong>
        Navy pilot, sincere but conflicted about marriage. Strong friendship with
        Sam.<br /><strong>Audition Lines:</strong></p>\r\n<ol>\r\n<li>\u201CHey, Stubbs.
        Mail call. I picked up your stuff for ya.\u201D</li>\r\n<li>\u201CAh. It looks
        like I\u2019m going to be a father.\u201D</li>\r\n<li>\u201CDenise is great.
        We\u2019ve only been dating a few months, but we have this connection, you
        know?\u201D</li>\r\n<li>\u201CI told her I\u2019d just have to marry her.
        And I meant it. Now, I\u2019m not sure.\u201D<br /><strong>Performance Notes:</strong>
        Warm, occasionally hesitant; show genuine emotion when talking about Denise.</li>\r\n</ol>\r\n<p><strong>Andrew
        Perantu \u2013 pronounced (Per-an-too)</strong></p>\r\n<p><strong>Description:</strong>
        Airman trying to hide how sick he is; stubborn.<br /><strong>Audition Lines:</strong></p>\r\n<ol>\r\n<li>(Deep
        coughing fit \u2013 6+ seconds \u2013 ends with sniffling and blowing nose)</li>\r\n<li>\u201CI\u2019m
        fine.\u201D</li>\r\n<li>(slight cough/sniffling/snapped) \u201CI\u2019m fine.\u201D</li>\r\n<li>(mumbling
        or cursing as he walks away and throws something)<br /><strong>Performance
        Notes:</strong> Physicality matters \u2013 convey illness while being defensive.</li>\r\n</ol>\r\n<p><strong>Commander
        Hines</strong></p>\r\n<p><strong>Description:</strong> No-nonsense Navy officer,
        concise and authoritative.<br /><strong>Audition Lines:</strong></p>\r\n<ol>\r\n<li>\u201CMedical
        emergency. We\u2019re to airlift a fisherman to the carrier.\u201D</li>\r\n<li>\u201CYou\u2019re
        right. Perantu, get to sick bay. Stubbs, Mike, let\u2019s go.\u201D</li>\r\n<li>\u201CWhere\u2019s
        the Corpsman?\u201D</li>\r\n<li>\u201CCome on, let\u2019s go. We have a lot
        of work to do.\u201D<br /><strong>Performance Notes:</strong> Strong, clipped
        delivery; convey urgency.</li>\r\n</ol>\r\n<p><strong>Fisherman</strong></p>\r\n<p><strong>Description:</strong>
        Injured and heavily medicated; speech is slurred.\_ He\u2019s drunk.<br /><strong>Audition
        Lines:</strong></p>\r\n<ol>\r\n<li>(slurred) \u201CWatkinda Navy outfitzthat?\u201D</li>\r\n<li>(slurred)
        \u201CMe too.\u201D</li>\r\n<li>(slurred) \u201CHey! Thandzinthere.\u201D</li>\r\n<li>(slurred)
        \u201CIzmyrinonthere?\u201D<br /><strong>Performance Notes:</strong> Deliver
        lines slowly, like under morphine; mix humor with confusion.</li>\r\n</ol>\r\n<p><strong>Doctor
        Wilson \u2013 </strong></p>\r\n<p><strong>Description:</strong> Professional
        Navy doctor, direct and efficient.<br /><strong>Audition Lines:</strong></p>\r\n<ol>\r\n<li>\u201CWhere\u2019s
        the hand?\u201D</li>\r\n<li>\u201CI\u2019ll take it in, Eric. You need to
        clean up. Good job!\u201D</li>\r\n<li>\u201CCome on, let\u2019s go. We have
        a lot of work to do.\u201D</li>\r\n<li>\u201CWhere\u2019s the hand? \u2026Here
        you go, sir.\u201D<br /><strong>Performance Notes:</strong> Clear, calm authority
        with a brisk pace.</li>\r\n</ol>\r\n<p><strong>Janet Barnes</strong></p>\r\n<p><strong>Description:</strong>
        Mike\u2019s unstable ex; manipulative, jealous, later aggressive.<br /><strong>Audition
        Lines:</strong></p>\r\n<ol>\r\n<li>\u201CDear Mike. You don\u2019t have to
        marry her because of this. These things can be taken care of before you even
        return!\u201D</li>\r\n<li>\u201CStay back!\u201D</li>\r\n<li>\u201CI have
        no life. And this bitch took what chance I had for a real life.\u201D</li>\r\n<li>\u201CNo!
        No! \u2026No\u2026 no\u2026 it\u2019s not fair\u2026\u201D<br /><strong>Performance
        Notes:</strong> Start calm and persuasive; escalate to dangerous instability.</li>\r\n</ol>\r\n<p><strong>Denise
        Green</strong></p>\r\n<p><strong>Description:</strong> Confident, warm, grounded.
        Deeply in love with Mike.<br /><strong>Audition Lines:</strong></p>\r\n<ol>\r\n<li>\u201CHi!
        I\u2019d know you anywhere, Eric! Mike had some pictures from your last cruise
        shore leave in Hong Kong.\u201D</li>\r\n<li>\u201CI agree 100%. Attitude is
        what makes you or breaks you, isn\u2019t it?\u201D</li>\r\n<li>\u201CI\u2019m
        fine, really. It would be great if Mike were here, but I never was one for
        those fru-fru weddings anyway.\u201D</li>\r\n<li>\u201CWhat the\u2026 wow\u2026
        you think that car could get any closer?\u201D<br /><strong>Performance Notes:</strong>
        Natural charm, with flashes of steel when threatened.</li>\r\n</ol>\r\n<p><strong>Receptionist</strong></p>\r\n<p><strong>Description:</strong>
        Friendly and efficient chapel staff member.<br /><strong>Audition Lines:</strong></p>\r\n<ol>\r\n<li>\u201CWe
        have a ceremony in that one.\u201D</li>\r\n<li>\u201CYes ma\u2019am. Let\u2019s
        get you in the books, my dear.\u201D</li>\r\n<li>\u201CYes ma\u2019am.\u201D</li>\r\n<li>\u201CDo
        you have one o\u2019clock available? Yes ma\u2019am.\u201D<br /><strong>Performance
        Notes:</strong> Warm professionalism; upbeat customer service tone.</li>\r\n</ol>\r\n<p><strong>Clerk</strong></p>\r\n<p><strong>Description:</strong>
        Helpful hotel front desk staff.<br /><strong>Audition Lines:</strong></p>\r\n<ol>\r\n<li>\u201CCertainly.
        One night?\u201D</li>\r\n<li>\u201CReally? How nice.\u201D</li>\r\n<li>\u201CI\u2019m
        really not supposed to give out information about our clients, but since it\u2019s
        a surprise, I don\u2019t see the harm.\u201D</li>\r\n<li>\u201CWell, they
        ordered a limo for noon and any flowers are supposed to be sent to the Chapel
        of the Roses.\u201D<br /><strong>Performance Notes:</strong> Courteous, friendly,
        slightly chatty.</li>\r\n</ol>\r\n<p><strong>Mr. Green</strong></p>\r\n<p><strong>Description:</strong>
        Boisterous father of the bride; tough, humorous, protective.<br /><strong>Audition
        Lines:</strong></p>\r\n<ol>\r\n<li>\u201CComon\u2019 boy! It\u2019s time for
        breakfast! We want to hear more flying stories about my future son-in-law!\u201D</li>\r\n<li>\u201CAlright
        everyone. The Minister said that everything is in order. It\u2019s time to
        get this show on the road.\u201D</li>\r\n<li>\u201CEric! She stabbed me\u2026
        but\u2026 Denise\u2026 Get Denise!\u201D</li>\r\n<li>\u201CWhaddaya mean,
        what about Denise? She\u2019s here to get married, son! This is just a little
        scratch as far as this goes.\u201D<br /><strong>Performance Notes:</strong>
        Loud, spirited, loving in his own gruff way.</li>\r\n</ol>\r\n<p><strong>Minister</strong></p>\r\n<p><strong>Description:</strong>
        Warm but formal officiant.<br /><strong>Audition Lines:</strong></p>\r\n<ol>\r\n<li>(clear
        throat)</li>\r\n<li>\u201CWe are gathered here today in the sight of God\u2026\u201D</li>\r\n<li>\u201CIt\u2019s
        time to get this show on the road \u2013 er\u2026 into the Red Rose Room we
        go.\u201D</li>\r\n<li>\u201CWe are gathered here today in the sight of God\u2026\u201D
        (ceremonial delivery)<br /><strong>Performance Notes:</strong> Gentle, steady,
        ceremonial pacing.</li>\r\n</ol>\r\n<p><strong>Chris Richardson</strong></p>\r\n<p><strong>Description:</strong>
        Neighbor or friend, upbeat, slightly exasperated.<br /><strong>Audition Lines:</strong></p>\r\n<ol>\r\n<li>\u201CKenny!
        What are you going?\u201D</li>\r\n<li>\u201CI don\u2019t know about you, but
        I\u2019d like to have all that unloaded before it\u2019s hot enough to melt!\u201D</li>\r\n<li>\u201CKenny!
        What are you doing?\u201D</li>\r\n<li>\u201CCome on, let\u2019s get this finished.\u201D<br
        /><strong>Performance Notes:</strong> Light energy with a casual, conversational
        style.</li>\r\n</ol>\r\n<p>&nbsp;</p>\r\n<p>&nbsp;</p>\r\n<hr />\r\n<h3><strong>The
        Witching Hour Casting Call Results:</strong></h3>\r\n<p>The following people
        will be in The Witching Hour:</p>\r\n<ul>\r\n<li>Justin Fife as Scott Lancaster</li>\r\n<li>Rachel
        Pulliam as Morgan Wilson</li>\r\n<li>Shane Harris as Jordan Green</li>\r\n<li>Paul
        Arbisi as Beau Miller</li>\r\n<li>Kaitlyn Atwater as Michelle Stevens</li>\r\n<li>Austin
        Curtis as Dennis Nelson</li>\r\n<li>Jennifer Atwater as Avery Johnson</li>\r\n<li>Clive
        Saunders as Gavin McHenry</li>\r\n<li>Edward Herman as Thomas, and</li>\r\n<li>MJ
        Cogburn as Sister Agnes Margaret</li>\r\n</ul>\r\n<p></p><!-- /wp:group --><!--
        wp:post-content --><!-- wp:group -->\r\n<div class=\"wp-block-group\">\r\n<div
        class=\"wp-block-group__inner-container\"><!-- wp:freeform -->\r\n<p>We are
        thoroughly excited that you want to audition for one of our productions!</p>\r\n<p>Thank
