        \           <h1 class=\"entry-title\">About Us</h1>        </header><!-- .entry-header
        -->\n        <div class=\"entry-content-wrap\">\n        \n        <div class=\"entry-content\">\n
        \           <div class=\"inner-entry-content\">\n                We are a
        darker audio drama company that presents original projects such as Autumn,
        Five Minute Fears, Madness, Night Terrors, Tales from the Museum, and The
        Falcon Banner.\_ We also have fan-fiction interpretations of Batman, Dr. Who,
        He-Man, Outer Limits, Quantum Leap, and Star Trek.\r\n\r\nAs always in the
        ill-omened darkness, you&#8217;ll find the most breathtaking surprises, so
        be sure to stay tuned!\r\n<p style=\"text-align: left;\">If you feel inspired
        or are daring, take a leap!</p>\r\n\r\n<ul>\r\n \t<li>Do you want to act for
        Darker Projects?\_ Look and see if we have any auditions up on the <a href=\"https://darkerprojects.com/auditions-2/\">Auditions
        Page</a>!</li>\r\n \t<li>Do you want to contact us and tell us how much you
        enjoyed our shows, or if you have an issue on the site?\_ <a href=\"mailto:mj@darkerprojects.com\">Email
        us</a>!</li>\r\n \t<li>Would you like Darker Projects to make an audio adaptation
        of your script?\_ Email our executive producer, <a href=\"mailto:mj@darkerprojects.com\">MJ
        Cogburn</a>, and see if it&#8217;s possible!</li>\r\n</ul>\r\nWhen we release
        a new show, it will be released at midnight CST.\_ Keep an eye out for new
        projects coming up!\r\n\r\nNow&#8230; onward into the dark&#8230;.\r\n\r\n<!--
        /wp:post-content -->            </div>\n        </div><!-- .entry-content
