        144w, https://darkerprojects.com/wp-content/uploads/2018/03/NightTerrors.jpg
        400w\" sizes=\"(max-width: 248px) 100vw, 248px\" />\r\n<h3><strong>On A Country
        Road</strong></h3>\r\n<!-- /wp:post-content --><!-- wp:paragraph -->\r\n\r\nThe
        anatomy of terror is fascinating to contemplate. Danger does not necessarily
        breed fear &#8212; unless the danger is unknown, the circumstances are unrelated
        to the experience of the frightened. The rustle of leaves on a spring day
        is a happy, sunny sound. The same leaves rustling in the dark of a midnight
        wind become precursors of doom, the whisperings of ghosts, the swaying of
        a hangman&#8217;s knot. Fear feeds upon itself and grows mightily in darkness,
        until it robs the mind of reason and becomes blind terror. Then &#8212; anything
        can happen. And much does, in the next few minutes.\r\n\r\n<!-- /wp:paragraph
        --><!-- wp:paragraph -->\r\n\r\nWritten by Walter Bazar through the generic
        Radio Workshop script library.\r\n\r\n<!-- /wp:paragraph --><!-- wp:paragraph
        -->\r\n\r\n<strong>Featured in the cast were:</strong>\r\n\r\n<!-- /wp:paragraph
        --><!-- wp:paragraph -->\r\n<ul>\r\n \t<li>Pete Lutz as David</li>\r\n \t<li>Rachel
        Pulliam as Dorothy</li>\r\n \t<li>Tanja Milojevic as the woman</li>\r\n \t<li>Logan
        Smith as the Officer</li>\r\n \t<li>Shane Harris as the Newscaster and Production
        Announcer</li>\r\n \t<li>Your Host is Onku</li>\r\n</ul>\r\nThe story was
        written by Walter Bazar.\r\n\r\nMusic by Kevin MacLeod and Kai Hartwig.\r\n\r\n<!--
        /wp:paragraph --><!-- wp:paragraph -->\r\n\r\n<!-- /wp:paragraph --><!-- wp:paragraph
        -->\r\n\r\nThe Series Producer is MJ Cogburn.\_ Produced and Post Production
