        a lot of work to do.\u201D</li>\r\n<li>\u201CWhere\u2019s the hand? \u2026Here
        you go, sir.\u201D<br /><strong>Performance Notes:</strong> Clear, calm authority
        with a brisk pace.</li>\r\n</ol>\r\n<p><strong>Janet Barnes</strong></p>\r\n<p><strong>Description:</strong>
        Mike\u2019s unstable ex; manipulative, jealous, later aggressive.<br /><strong>Audition
        Lines:</strong></p>\r\n<ol>\r\n<li>\u201CDear Mike. You don\u2019t have to
        marry her because of this. These things can be taken care of before you even
        return!\u201D</li>\r\n<li>\u201CStay back!\u201D</li>\r\n<li>\u201CI have
        no life. And this bitch took what chance I had for a real life.\u201D</li>\r\n<li>\u201CNo!
        No! \u2026No\u2026 no\u2026 it\u2019s not fair\u2026\u201D<br /><strong>Performance
        Notes:</strong> Start calm and persuasive; escalate to dangerous instability.</li>\r\n</ol>\r\n<p><strong>Denise
        Green</strong></p>\r\n<p><strong>Description:</strong> Confident, warm, grounded.
        Deeply in love with Mike.<br /><strong>Audition Lines:</strong></p>\r\n<ol>\r\n<li>\u201CHi!
        I\u2019d know you anywhere, Eric! Mike had some pictures from your last cruise
        shore leave in Hong Kong.\u201D</li>\r\n<li>\u201CI agree 100%. Attitude is
        what makes you or breaks you, isn\u2019t it?\u201D</li>\r\n<li>\u201CI\u2019m
        fine, really. It would be great if Mike were here, but I never was one for
        those fru-fru weddings anyway.\u201D</li>\r\n<li>\u201CWhat the\u2026 wow\u2026
        you think that car could get any closer?\u201D<br /><strong>Performance Notes:</strong>
        Natural charm, with flashes of steel when threatened.</li>\r\n</ol>\r\n<p><strong>Receptionist</strong></p>\r\n<p><strong>Description:</strong>
        Friendly and efficient chapel staff member.<br /><strong>Audition Lines:</strong></p>\r\n<ol>\r\n<li>\u201CWe
        have a ceremony in that one.\u201D</li>\r\n<li>\u201CYes ma\u2019am. Let\u2019s
        get you in the books, my dear.\u201D</li>\r\n<li>\u201CYes ma\u2019am.\u201D</li>\r\n<li>\u201CDo
        you have one o\u2019clock available? Yes ma\u2019am.\u201D<br /><strong>Performance
        Notes:</strong> Warm professionalism; upbeat customer service tone.</li>\r\n</ol>\r\n<p><strong>Clerk</strong></p>\r\n<p><strong>Description:</strong>
        Helpful hotel front desk staff.<br /><strong>Audition Lines:</strong></p>\r\n<ol>\r\n<li>\u201CCertainly.
        One night?\u201D</li>\r\n<li>\u201CReally? How nice.\u201D</li>\r\n<li>\u201CI\u2019m
        really not supposed to give out information about our clients, but since it\u2019s
        a surprise, I don\u2019t see the harm.\u201D</li>\r\n<li>\u201CWell, they
        ordered a limo for noon and any flowers are supposed to be sent to the Chapel
        of the Roses.\u201D<br /><strong>Performance Notes:</strong> Courteous, friendly,
        slightly chatty.</li>\r\n</ol>\r\n<p><strong>Mr. Green</strong></p>\r\n<p><strong>Description:</strong>
        Boisterous father of the bride; tough, humorous, protective.<br /><strong>Audition
        Lines:</strong></p>\r\n<ol>\r\n<li>\u201CComon\u2019 boy! It\u2019s time for
        breakfast! We want to hear more flying stories about my future son-in-law!\u201D</li>\r\n<li>\u201CAlright
        everyone. The Minister said that everything is in order. It\u2019s time to
        get this show on the road.\u201D</li>\r\n<li>\u201CEric! She stabbed me\u2026
        but\u2026 Denise\u2026 Get Denise!\u201D</li>\r\n<li>\u201CWhaddaya mean,
        what about Denise? She\u2019s here to get married, son! This is just a little
        scratch as far as this goes.\u201D<br /><strong>Performance Notes:</strong>
        Loud, spirited, loving in his own gruff way.</li>\r\n</ol>\r\n<p><strong>Minister</strong></p>\r\n<p><strong>Description:</strong>
        Warm but formal officiant.<br /><strong>Audition Lines:</strong></p>\r\n<ol>\r\n<li>(clear
        throat)</li>\r\n<li>\u201CWe are gathered here today in the sight of God\u2026\u201D</li>\r\n<li>\u201CIt\u2019s
        time to get this show on the road \u2013 er\u2026 into the Red Rose Room we
        go.\u201D</li>\r\n<li>\u201CWe are gathered here today in the sight of God\u2026\u201D
        (ceremonial delivery)<br /><strong>Performance Notes:</strong> Gentle, steady,
        ceremonial pacing.</li>\r\n</ol>\r\n<p><strong>Chris Richardson</strong></p>\r\n<p><strong>Description:</strong>
        Neighbor or friend, upbeat, slightly exasperated.<br /><strong>Audition Lines:</strong></p>\r\n<ol>\r\n<li>\u201CKenny!
        What are you going?\u201D</li>\r\n<li>\u201CI don\u2019t know about you, but
        I\u2019d like to have all that unloaded before it\u2019s hot enough to melt!\u201D</li>\r\n<li>\u201CKenny!
        What are you doing?\u201D</li>\r\n<li>\u201CCome on, let\u2019s get this finished.\u201D<br
        /><strong>Performance Notes:</strong> Light energy with a casual, conversational
        style.</li>\r\n</ol>\r\n<p>&nbsp;</p>\r\n<p>&nbsp;</p>\r\n<hr />\r\n<h3><strong>The
        Witching Hour Casting Call Results:</strong></h3>\r\n<p>The following people
        will be in The Witching Hour:</p>\r\n<ul>\r\n<li>Justin Fife as Scott Lancaster</li>\r\n<li>Rachel
        Pulliam as Morgan Wilson</li>\r\n<li>Shane Harris as Jordan Green</li>\r\n<li>Paul
        Arbisi as Beau Miller</li>\r\n<li>Kaitlyn Atwater as Michelle Stevens</li>\r\n<li>Austin
        Curtis as Dennis Nelson</li>\r\n<li>Jennifer Atwater as Avery Johnson</li>\r\n<li>Clive
        Saunders as Gavin McHenry</li>\r\n<li>Edward Herman as Thomas, and</li>\r\n<li>MJ
        Cogburn as Sister Agnes Margaret</li>\r\n</ul>\r\n<p><!-- /wp:paragraph --></p><!--
