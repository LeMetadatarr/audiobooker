        \               \r\n<figure class=\"wp-block-table aligncenter is-style-regular\">Here
        are a list of our original shows that we have at Darker Projects &#8211; from
        updates, zombies, short tales, nightmarish tales, poems and to Museums &#8211;\_
        we hope that you can find one that you like!\_ Enjoy!</figure>\r\n<figure
        class=\"wp-block-table aligncenter is-style-regular\">\r\n<table>\r\n<tbody>\r\n<tr>\r\n<td
        class=\"has-text-align-center\" data-align=\"center\"><img decoding=\"async\"
        class=\"\" style=\"width: 156px;\" src=\"http://darkerprojects.com/wp-content/uploads/2018/03/Autumn_podcast.jpg\"
        height=\"156\" /></td>\r\n<td class=\"has-text-align-center\" data-align=\"center\">\r\n<p>&nbsp;</p>\r\n<p><a
        href=\"http://darkerprojects.com/autumn\"><strong><em>Autumn</em></strong>\_</a><br
        />Darker Projects in association with\_<a href=\"http://www.theinfected.co.uk/\">Infected
        Books</a>\_presents David Moody\u2019s vision of apocalyptic horror.\_<span
        class=\"has-inline-color has-pale-pink-color\">\_<span style=\"color: #ff0000;\"><strong>(Completed)</strong></span></span></p>\r\n</td>\r\n</tr>\r\n<tr>\r\n<td
        class=\"has-text-align-center\" data-align=\"center\"><img decoding=\"async\"
        style=\"width: 200px;\" src=\"http://darkerprojects.com/wp-content/uploads/2020/02/behind-Darker_Projects.png\"
        /></td>\r\n<td class=\"has-text-align-center\" data-align=\"center\">\r\n<p>&nbsp;</p>\r\n<p><strong><em><a
        href=\"http://darkerprojects.com/behind-the-scenes/\">Behind The Scenes</a></em></strong>
        <br />A look behind the scenes to get to know the ins and outs of Darker Projects.</p>\r\n</td>\r\n</tr>\r\n<tr>\r\n<td
        class=\"has-text-align-center\" data-align=\"center\">\r\n<p><img decoding=\"async\"
        class=\"\" style=\"width: 247px;\" src=\"http://darkerprojects.com/wp-content/uploads/2020/09/DP_Uncovered.jpg\"
        height=\"118\" /></p>\r\n<p>&nbsp;</p>\r\n</td>\r\n<td class=\"has-text-align-center\"
        data-align=\"center\">\r\n<p>&nbsp;</p>\r\n<p><strong><em><a href=\"http://darkerprojects.com/dp-uncovered/\">Darker
        Projects Uncovered</a></em></strong> <br />A podcast with MJ Cogburn where
        she tells you about the madness in her mind, and about what\u2019s being produced,
        auditions, and other information.</p>\r\n</td>\r\n</tr>\r\n<tr>\r\n<td class=\"has-text-align-center\"
        data-align=\"center\"><img decoding=\"async\" style=\"width: 200px;\" src=\"http://darkerprojects.com/wp-content/uploads/2018/03/FiveMinuteFears.jpg\"
        /></td>\r\n<td class=\"has-text-align-center\" data-align=\"center\">\r\n<p>&nbsp;</p>\r\n<p><a
        href=\"http://darkerprojects.com/five-minute-fears\"><strong><em>Five Minute
        Fears</em></strong></a>\_<br />Horror and suspense and brought it to you in
        bite-sized chunks.</p>\r\n</td>\r\n</tr>\r\n<tr>\r\n<td class=\"has-text-align-center\"
        data-align=\"center\"><img decoding=\"async\" class=\"\" style=\"width: 128px;\"
        src=\"http://darkerprojects.com/wp-content/uploads/2018/03/Madness.jpg\" height=\"128\"
        /></td>\r\n<td class=\"has-text-align-center\" data-align=\"center\">\r\n<p>&nbsp;</p>\r\n<p><strong><a
        href=\"http://darkerprojects.com/madness/\"><em>Madness</em></a></strong>\_<br
        />The world has been affected with some kind of virus-fighting against the
        growing madness of the world, Jarred Carvey is forced to survive the threat
        of an enemy and friend alike as he searches to reunite with his wife and daughter
        as he slowly unravels the mystery surrounding a world afflicted by Madness.</p>\r\n</td>\r\n</tr>\r\n<tr>\r\n<td
        class=\"has-text-align-center\" data-align=\"center\"><img decoding=\"async\"
        style=\"width: 200px;\" src=\"http://darkerprojects.com/wp-content/uploads/2018/03/NightTerrors.jpg\"
        /></td>\r\n<td class=\"has-text-align-center\" data-align=\"center\">\r\n<p>&nbsp;</p>\r\n<p><a
        href=\"http://darkerprojects.com/night-terrors\"><strong><em>Night Terrors</em></strong></a>\_<br
        />An anthology of horror and suspense.</p>\r\n</td>\r\n</tr>\r\n<tr>\r\n<td
        class=\"has-text-align-center\" data-align=\"center\"><img decoding=\"async\"
        style=\"width: 200px;\" src=\"http://darkerprojects.com/wp-content/uploads/2018/03/othervoices.jpg\"
