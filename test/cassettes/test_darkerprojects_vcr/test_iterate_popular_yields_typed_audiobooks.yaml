        \           <h1 class=\"entry-title\">Contribute!</h1>        </header><!--
        .entry-header -->\n        <div class=\"entry-content-wrap\">\n        \n
        \       <div class=\"entry-content\">\n            <div class=\"inner-entry-content\">\n
        \               <p>Darker Projects has been producing full-cast audio dramas
        since 2004. Our focus is on creepy, scary, not-so-nice tales. There are not
        always happy endings in this world, and we can&#8217;t stop being fascinated
        by the dark. We hope you will enjoy our work and perhaps contribute.</p>\n<p>Our
        <a href=\"http://wiki.darkerprojects.com/\">Darker Projects Wiki</a> explains
        guidelines, policies, and procedures as well as features all the contributors
        to Darker Projects.</p>\n<p>We welcome you to join us\_should you wish to
        try your skills at acting, writing, et cetera.</p>\n<p>&nbsp;</p>\n<hr />\n<p>&nbsp;</p>\n<p>We
        appreciate our listeners! \_We are undoubtedly grateful that you take the
        time to listen to and love our programming. \_All our shows are labors of
        pain, distress, and of course, at times make us feel like the zombies that
        we write about; however, as such, we don&#8217;t get paid for doing them (none
        of us: actors, writers, producers). \_This means that as time goes by, we
        sometimes need help from our listeners to keep up with the site, and the shows.</p>\n<p>We
        ask that you donate if you can. \_Any amount is appreciated, and it truly
        does keep Harbinger from snacking on the producer&#8217;s legs &#8211; and
        it&#8217;s difficult for our producers to deal with that type of thing. \_It&#8217;s
        frustrating and darn right upsetting at times.</p>\n<p>Thank you.</p>\n<p><a
        title=\"Donate To Darker Projects\" href=\"https://www.paypal.com/us/cgi-bin/webscr?cmd=_flow&amp;SESSION=beS1JjNI559Nc8s72dgK3rco2noRka1BusGigrwwoo4n4e_RKFaBgGgBTne&amp;dispatch=5885d80a13c0db1f8e263663d3faee8d66f31424b43e9a70645c907a6cbd8fb4\"
        target=\"_blank\" rel=\"noopener noreferrer\"><img decoding=\"async\" class=\"size-full
        wp-image-92 aligncenter\" src=\"http://darkerprojects.com/wp-content/uploads/2014/12/donategf120.gif\"
        alt=\"donategf120\" width=\"120\" height=\"47\" /></a></p>\n            </div>\n
        \       </div><!-- .entry-content -->\n    </div><!-- .entry-content-wrap
