name: Run License Tests
on:
  push:
  workflow_dispatch:

jobs:
  license_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev swig libssl-dev
      - name: Install package
        run: pip install .
      - name: Install licheck
        run: pip install git+https://github.com/NeonJarbas/lichecker
      - name: Install test dependencies
        run: pip install pytest pytest-timeout pytest-cov
      - name: Test licenses
        run: pytest test/license_tests.py
