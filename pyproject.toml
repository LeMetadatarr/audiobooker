[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobooker"
dynamic = ["version"]
description = "Audiobook scraper — search and stream from Librivox, LoyalBooks, and more"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.8"
dependencies = [
    "requests",
    "bs4",
    "feedparser",
    "rapidfuzz",
    "site-map-parser",
    "click>=8.0",
    "mediavocab>=2.0.0a2",
]

[project.optional-dependencies]
test = ["pytest", "vcrpy", "pytest-vcr"]
youtube = ["tutubo"]
stealth = ["curl-cffi", "unblock_requests"]

[project.scripts]
audiobooker = "audiobooker.cli:cli"

[project.urls]
Homepage = "https://github.com/LeMetadatarr/audiobooker"
Repository = "https://github.com/LeMetadatarr/audiobooker"

[tool.setuptools.packages.find]
where = ["."]
include = ["audiobooker*"]

[tool.setuptools.dynamic]
version = {attr = "audiobooker.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["test"]
