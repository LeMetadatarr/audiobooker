[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "audiobooker"
version = "0.5.0"
description = "Audiobook scraper — search and stream from Librivox, LoyalBooks, StoryNory, and more"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.8"
dependencies = [
    "requests",
    "bs4",
    "feedparser",
    "rapidfuzz",
    "requests-cache",
    "site-map-parser",
]

[project.urls]
Homepage = "https://github.com/OpenJarbas/audiobooker"
Repository = "https://github.com/OpenJarbas/audiobooker"

[tool.setuptools.packages.find]
where = ["."]
include = ["audiobooker*"]
